  "content": [
    {
      "name": "announcements",
      "label": "Announcements",
      "type": "file",
      "path": "announcements.json",
      "format": "json",
      "fields": [
        {
          "name": "announcements",
          "label": "Announcements",
          "type": "object",
          "list": true,
          "fields": [
            {
              "name": "title",
              "label": "Title",
              "type": "string",
              "required": true
            },
            {
              "name": "category",
              "label": "Category",
              "type": "select",
              "default": "info",
              "options": {
                "values": [
                  {
                    "name": "urgent",
                    "label": "Launch event"
                  },
                  {
                    "name": "meeting",
                    "label": "Meeting"
                  },
                  {
                    "name": "info",
                    "label": "Info"
                  }
                ]
              }
            },
            {
              "name": "when",
              "label": "Date or time",
              "type": "string",
              "required": true
            },
            {
              "name": "body",
              "label": "Message",
              "type": "text",
              "required": true
            },
            {
              "name": "image",
              "label": "Optional photo",
              "type": "image",
              "description": "Use a photo under 2 MB. For large photos or upload error 413, prepare a copy at https://interlakerocketry.org/prepare-photos.html before uploading."
            },
            {
              "name": "imageAlt",
              "label": "Photo description",
              "type": "string"
            },
            {
              "name": "link",
              "label": "Optional link",
              "type": "string"
            },
            {
              "name": "linkText",
              "label": "Link button text",
              "type": "string"
            },
            {
              "name": "published",
              "label": "Show on website",
              "type": "boolean",
              "default": true,
              "description": "Hide from the page by turning this off. Saved content is still stored in the public repository."
            }
          ]
        }
      ]
    },
